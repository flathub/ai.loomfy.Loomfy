app-id: ai.loomfy.Loomfy
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: loomfy

finish-args:
  - --socket=x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=dri
  - --share=network

modules:
  - name: loomfy
    buildsystem: simple
    build-commands:
      - cp -a . /app
    sources:
      - type: archive
        url: https://dl.loomfy.ai/releases/v1.11.0/Loomfy-1.11.0-x64.tar.gz
        sha256: 16d04ed5ecef2bf661631657e9ef9eb2ee021e3781dab409d1f7d43c938cb157
        x-checker-data:
          type: html
          url: https://dl.loomfy.ai/apt/dists/stable/main/binary-amd64/Packages
          version-pattern: 'Version: ([\d.]+)'
          url-template: https://dl.loomfy.ai/releases/v$version/Loomfy-$version-x64.tar.gz
