app-id: ai.loomfy.Loomfy
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: loomfy

finish-args:
  - --socket=x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=dri
  - --share=network

modules:
  - name: loomfy
    buildsystem: simple
    build-commands:
      - cp -a . /app
    sources:
      - type: archive
        url: https://dl.loomfy.ai/releases/v1.7.0/Loomfy-1.7.0-x64.tar.gz
        sha256: aae99e10f4d6f0e98f4ebd9a2393e00be44e7fed894073e22e895c29217342ac
        x-checker-data:
          type: html
          url: https://dl.loomfy.ai/apt/dists/stable/main/binary-amd64/Packages
          version-pattern: 'Version: ([\d.]+)'
          url-template: https://dl.loomfy.ai/releases/v$version/Loomfy-$version-x64.tar.gz
