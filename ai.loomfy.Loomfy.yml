app-id: ai.loomfy.Loomfy
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: loomfy

finish-args:
  - --socket=x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=dri
  - --share=network

modules:
  - name: loomfy
    buildsystem: simple
    build-commands:
      - cp -a . /app
    sources:
      - type: archive
        url: https://dl.loomfy.ai/releases/v1.9.1/Loomfy-1.9.1-x64.tar.gz
        sha256: b74cd365a42b261fef421cb121baec0e1a74149600ce614d1af3734b73eb331d
        x-checker-data:
          type: html
          url: https://dl.loomfy.ai/apt/dists/stable/main/binary-amd64/Packages
          version-pattern: 'Version: ([\d.]+)'
          url-template: https://dl.loomfy.ai/releases/v$version/Loomfy-$version-x64.tar.gz
